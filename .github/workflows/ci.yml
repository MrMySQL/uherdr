name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift', 'Vendor/GhosttyTerminal/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Toolchain
        run: swift --version

      - name: Core tests
        run: swift run HerdrCoreTests

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Verify bundle
        run: |
          codesign --verify --strict dist/uHerdr.app
          plutil -lint dist/uHerdr.app/Contents/Info.plist
